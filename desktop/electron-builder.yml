# electron-builder configuration for the Electron interface.
#
#   npm run build                      the renderer, into dist-renderer/
#   node scripts/dist.mjs --dir        an unpacked app for this machine
#   node scripts/dist.mjs --mac --arm64 | --mac --x64 | --win | --linux
#
# The Python runtime is NOT built here. `scripts/build_server.py` at the
# repository root builds it into dist/lazy-to-text-server, and the
# extraResources entry below copies that folder to resources/backend, the
# path desktop/electron/backend.cjs resolves in a packaged app. The runtime
# has to be built on the platform and architecture it will run on, which is
# why a macOS leg builds one architecture at a time.

# The same id as the Qt application this one replaces, on purpose. An install
# of this app upgrades the old one in place instead of sitting next to it,
# and macOS keeps the Microphone and Accessibility grants, the Launch
# Services file associations and the Dock identity, all of which it keys to
# the bundle id (and to the signing identity: scripts/setup-signing.sh gives
# a local build the same anchor from one build to the next; the CI build is
# ad hoc, so macOS asks again after each install). Both start the
# same runtime, so they also share one config.yaml and one single-instance
# lock (LazyToTextQt); the Windows installer offers to remove an Inno-installed
# Qt build (build/installer.nsh), because two copies cannot both run.
appId: io.github.aa-blinov.lazytotext
productName: Lazy to Text
copyright: Copyright (c) Alexander Blinov
artifactName: LazyToText-Desktop-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: release

# Chromium's locale files for the two languages the interface has; the
# others only translate its own context menus, and 55 of them are shipped
# otherwise. Chromium falls back to English for a system language not kept.
electronLanguages:
  - en-US
  - ru

# Removes the Info.plist keys Electron ships for capabilities the app does
# not use (see the file).
afterPack: build/after-pack.cjs

files:
  - package.json
  - electron/**/*
  - dist-renderer/**/*
  - assets/**/*

extraResources:
  - from: ../dist/lazy-to-text-server
    to: backend
    filter:
      - "**/*"
  # The notices that have to travel with the installer (ffmpeg is GPL, the
  # fonts are OFL), with the application's own licence beside them.
  - from: ../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../LICENSE
    to: LICENSE
  - from: licenses
    to: licenses

# Electron's fuses are compiled into the binary. The defaults leave the
# signed executable usable as a plain Node interpreter
# (ELECTRON_RUN_AS_NODE=1 runs any script with the app's identity, which on
# macOS includes its Microphone grant), as a debugger host (--inspect) and
# as a loader of an app.asar that was edited after signing. All of that is
# off here; `npx @electron/fuses read --app <app>` shows the result.
#
# grantFileProtocolExtraPrivileges is off because the window is served from
# its own scheme (l2t-app://), as is the start-up page, and nothing is loaded
# from file://. enableCookieEncryption is left alone:
# the app stores no cookies, and turning it on makes macOS ask for a
# keychain item at first start.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

# The runtime and Electron both ship; keep the archive as the default and
# leave the runtime outside it (extraResources is never packed into it).
asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# build/installer.nsh is picked up from the build resources: it registers the
# app as one of the programs offered for audio and video files ("Open with")
# without becoming the default for them, which electron-builder's own
# fileAssociations would (it writes the extension's default class).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: LazyToText-Desktop-${version}-setup-${arch}.${ext}

# The portable build is electron-builder's self-extracting wrapper: it
# unpacks the whole app, the 250 MB runtime included, to a temporary folder
# on every launch, so its start time and disk traffic follow that size. The
# installer does not do this. A leaner portable form (an unpacked zip) is not
# built; see specs/010-electron-interface/plan.md, Known Gaps.
portable:
  artifactName: LazyToText-Desktop-${version}-portable-${arch}.${ext}

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Apple Silicon only: the pinned onnxruntime has no wheel for Intel
  # Macs, so the runtime in resources/backend cannot be built for them.
  # scripts/dist.mjs refuses a runtime built for another architecture
  # than the app instead of shipping the wrong engine inside it.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # The runtime is signed by scripts/dist.mjs (code only, once), so
  # electron-builder must not walk its thousands of data files as well.
  signIgnore:
    - Contents/Resources/backend/
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  minimumSystemVersion: "12.0"
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Lazy to Text records audio from the microphone to transcribe it
      locally on your Mac. Audio never leaves the device.
    NSAppleEventsUsageDescription: >-
      Lazy to Text opens System Settings to help you grant the
      Accessibility permission required for global hotkeys.
  # CFBundleDocumentTypes, every extension the runtime accepts
  # (app/audio_formats.py; a test compares them). Alternate rank offers the app in "Open With"
  # without taking the default from the player the user already has.
  fileAssociations:
    - ext: [wav, flac, ogg, oga, opus, aiff, aif, mp3, m4a, aac, wma, amr, ac3, alac, mp4, mov, webm, mkv, avi, flv, 3gp, m4v, wmv, ts]
      name: Audio and video
      role: Editor
      rank: Alternate

dmg:
  sign: false
  artifactName: LazyToText-Desktop-${version}-mac-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Utility
  maintainer: Alexander Blinov <noreply@users.noreply.github.com>
  synopsis: Local speech-to-text
  # The desktop entry's MimeType list: "Open with Lazy to Text" for the same
  # audio and video the runtime can decode (a test maps every extension of
  # app/audio_formats.py to one of these). Existing types only, so no new
  # MIME type is registered and no default changes.
  mimeTypes:
    - audio/x-wav
    - audio/wav
    - audio/mpeg
    - audio/mp4
    - audio/x-m4a
    - audio/flac
    - audio/x-flac
    - audio/ogg
    - audio/opus
    - audio/x-opus+ogg
    - audio/aac
    - audio/x-aiff
    - audio/aiff
    - audio/x-ms-wma
    - audio/amr
    - audio/ac3
    - video/mp4
    - video/quicktime
    - video/webm
    - video/x-matroska
    - video/x-msvideo
    - video/x-flv
    - video/3gpp
    - video/x-m4v
    - video/x-ms-wmv
    - video/mp2t
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

deb:
  # The default list plus libportaudio2. The runtime bundle carries its own
  # PortAudio (lazy_to_text_server.spec), which the AppImage relies on; the
  # package manager can supply the system's as well, so a .deb never depends
  # on the bundled copy alone.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libportaudio2
