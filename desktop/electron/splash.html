<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy to Text</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf1c7;
        --ink: #3c3836;
        --muted: #665c54;
        --line: #d5c4a1;
        --accent: #af3a03;
        --danger: #9d0006;
        --panel: #f2e5bc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #282828;
          --ink: #ebdbb2;
          --muted: #a89984;
          --line: #504945;
          --accent: #fe8019;
          --danger: #fb4934;
          --panel: #32302f;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: 100%; max-width: 520px; padding: 24px 28px; }
      h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
      p { margin: 0 0 12px; color: var(--muted); }
      .spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 3px solid var(--line); border-top-color: var(--accent);
        animation: spin 0.9s linear infinite; margin-bottom: 14px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
      .error h1 { color: var(--danger); }
      #message { color: var(--ink); user-select: text; word-break: break-word; }
      details { margin: 0 0 12px; }
      summary { cursor: pointer; color: var(--muted); }
      pre {
        margin: 8px 0 0; padding: 8px 10px; max-height: 120px; overflow: auto;
        background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap;
        user-select: text;
      }
      .log { font-size: 12px; color: var(--muted); margin-bottom: 14px; word-break: break-all; }
      .log code { user-select: text; }
      .actions { display: flex; gap: 8px; }
      button {
        font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="root" role="status" aria-live="polite">
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <h1 id="title"></h1>
      <p id="body"></p>
      <p id="message" hidden></p>
      <details id="details" hidden><summary id="detailsLabel"></summary><pre id="detailsText"></pre></details>
      <div class="log" id="log" hidden><span id="logLabel"></span>: <code id="logPath"></code></div>
      <div class="actions" id="actions" hidden>
        <button class="primary" id="retry" type="button"></button>
        <button id="quit" type="button"></button>
      </div>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
