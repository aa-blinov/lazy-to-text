name: ci

# Install, test, build. Replace the commands with the stack's own; keep the
# structure. The house-style check is a separate workflow, so that a failure
# of the standard is visibly different from a failure of the code.

on:
  # Every branch, because the default branch of a repository in this
  # collection is not always main: most are on master, and one is on prod.
  # A filter on main would mean the check never ran.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Replace this block with the stack's toolchain.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          # pip install -e '.[dev]'

      - name: Test
        # run: python3 -m pytest -q
        run: echo "Replace with the test command for this stack."

      - name: Build
        # run: python3 -m build
        run: echo "Replace with the build command for this stack."
