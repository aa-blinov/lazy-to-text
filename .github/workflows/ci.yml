name: ci

# Lint the Python code on every push and pull request. The full test suite
# runs in ``tests.yml`` (on all three platforms, and before any release), and
# the Electron shell and renderer in ``desktop.yml``. This job is the one that
# fails fast on the mistakes a linter finds: undefined names, unused imports
# and variables, and syntax errors. Its rules are the ones the code passes;
# ``F811`` (a fixture reused as a parameter) is pytest's own pattern and is
# left out on purpose.

on:
  # Every branch, because the default branch of a repository in this
  # collection is not always main: most are on master, and one is on prod.
  # A filter on main would mean the check never ran.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python3 -m pip install "ruff==0.17.3"

      - name: Check
        run: ruff check app scripts tests --select E9,F63,F7,F82,F401,F841,F821 --output-format concise
