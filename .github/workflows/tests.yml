name: tests

# The suite has only ever run on one developer machine, which is the
# worst place to find out what breaks on Windows. The Windows leg is
# the point of the matrix: a third of this app's platform-conditional
# code (clipboard_manager, audio_feedback, instance_manager,
# hotkey_listener) has never executed anywhere else, because every
# machine it has run on is a Mac.
#
# ``QT_QPA_PLATFORM=offscreen`` is not optional here. It is what keeps
# Cocoa and the WinAPI from opening a real window on a runner with no
# display — and the whole GUI suite depends on it, so it belongs in the
# environment rather than in every test invocation.

on:
  push:
    branches:
      - prod
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes to the same ref make the old run's answer obsolete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not hide the other two — the whole
      # reason for the matrix is the platforms disagreeing.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      QT_QPA_PLATFORM: offscreen
      # The font-alias notice is a macOS-runner artefact and it lands in
      # the middle of otherwise useful output.
      QT_LOGGING_RULES: 'qt.qpa.fonts=false'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Full history, because ``tests/test_version.py`` reads the
          # release tags to check the tree's version against the newest
          # one. At the default depth of 1 no tags are fetched, so the
          # check would skip on every run and quietly stop being a
          # check. 388 commits is nothing to fetch.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install Python 3.12
        run: uv python install 3.12

      # PySide6 links against these through QtGui, and the runner image
      # does not ship them: without libEGL the very first `import
      # PySide6.QtGui` — which pytest-qt does while reading its config,
      # before collecting a single test — dies with an INTERNALERROR and
      # the run reports nothing about the suite at all.
      #
      # xvfb is not for Qt, which is told to use the offscreen platform
      # and never touches a display. It is for pynput, which the hotkey
      # listener imports on Linux and which opens an X connection at
      # import time — so one test module took the whole run down at
      # collection with "failed to acquire X connection".
      # libportaudio2 is the same class of problem one layer down:
      # sounddevice raises `OSError: PortAudio library not found` at
      # import, which took 36 tests with it. Nothing about a
      # speech-to-text app should need an audio device to import.
      - name: Install Qt, X and audio runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libportaudio2 libxkbcommon-x11-0 xvfb

      - name: Sync dependencies
        # ``--frozen`` refuses to touch uv.lock, so a stale lock fails
        # the run instead of silently resolving something new. The
        # Windows-only deps (pywin32, global-hotkeys, nvidia-ml-py) are
        # platform markers in pyproject and arrive on that leg alone —
        # which is the first time they have been installed by anything
        # other than a developer.
        run: uv sync --frozen

      - name: Report the platform
        run: uv run python -c "import platform, sys; print(platform.platform()); print(sys.version)"

      - name: Run the suite
        if: runner.os != 'Linux'
        run: uv run --frozen python -m pytest tests/ -q

      # …and under a virtual X server on Linux, because pynput opens an
      # X connection at import time and the hotkey listener imports it
      # there. ``-a`` picks a free display number rather than assuming
      # :0 is free, which matters when two jobs share a runner. Qt is
      # still told to use the offscreen platform, so this is a display
      # for pynput and nothing else.
      - name: Run the suite under a virtual X server
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen python -m pytest tests/ -q
