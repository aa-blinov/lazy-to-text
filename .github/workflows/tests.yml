name: tests

# The suite has only ever run on one developer machine, which is the
# worst place to find out what breaks on Windows. The Windows leg is
# the point of the matrix: a third of this app's platform-conditional
# code (clipboard_manager, audio_feedback, instance_manager,
# hotkey_listener) has never executed anywhere else, because every
# machine it has run on is a Mac.
#
# This runs the Python engine and runtime suite. The Electron shell and
# renderer have their own workflow (``desktop.yml``).

on:
  push:
    # ``branches`` and ``tags`` are OR'd when both are given, so adding
    # tags here widens the trigger without narrowing it: a ``v*`` push is
    # neither a branch push to ``prod`` nor a pull request, so the exact
    # commit ``release.yml`` publishes had no green suite behind it.
    # ``release.yml`` does not gate itself on this workflow's status —
    # it starts on the same tag push — so this is visibility, not a
    # release gate; what it buys is that a red commit is discoverable
    # before anyone downloads the artifact.
    tags:
      - 'v*'
    branches:
      - prod
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes to the same ref make the old run's answer obsolete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not hide the other two — the whole
      # reason for the matrix is the platforms disagreeing.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          # Full history, because ``tests/test_version.py`` reads the
          # release tags to check the tree's version against the newest
          # one. At the default depth of 1 no tags are fetched, so the
          # check would skip on every run and quietly stop being a
          # check. 388 commits is nothing to fetch.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install Python 3.12
        run: uv python install 3.12

      # xvfb is for pynput, which the hotkey listener imports on Linux and
      # which opens an X connection at import time — so one test module
      # took the whole run down at collection with "failed to acquire X
      # connection".
      # libportaudio2 is the same class of problem one layer down:
      # sounddevice raises `OSError: PortAudio library not found` at
      # import, which took 36 tests with it. Nothing about a
      # speech-to-text app should need an audio device to import.
      - name: Install X and audio runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 xvfb

      - name: Sync dependencies
        # ``--frozen`` refuses to touch uv.lock, so a stale lock fails
        # the run instead of silently resolving something new. The
        # Windows-only deps (pywin32, global-hotkeys, nvidia-ml-py) are
        # platform markers in pyproject and arrive on that leg alone —
        # which is the first time they have been installed by anything
        # other than a developer.
        run: uv sync --frozen

      - name: Report the platform
        run: uv run python -c "import platform, sys; print(platform.platform()); print(sys.version)"

      # Two passes, in two steps. Everything parallel first; then the
      # wall-clock budget tests (marker ``timing``) serially. Under
      # parallel load on a shared runner they can exceed their budgets,
      # and that is not a regression.
      #
      # Two steps, not two commands in one: the Windows leg runs under
      # PowerShell, where ``&&`` and a backslash continuation are a
      # parse error, and a shell-specific chain is not worth having. A
      # step's exit status is its own command's, so a red main run fails
      # the job — which is the point. The two commands used to share one
      # step, and the step's exit status was then the *second* run's —
      # the timing pass, eight tests that always pass — so a red main
      # run was reported as a green job. Measured: three failures in the
      # Windows leg's main run, and the job said ``success``.
      - name: Run the suite
        if: runner.os != 'Linux'
        run: uv run --frozen python -m pytest tests/ -q -n auto -m "not timing"

      - name: Run the timing tests
        if: runner.os != 'Linux'
        run: uv run --frozen python -m pytest tests/ -q -m timing

      # …and under a virtual X server on Linux, because pynput opens an
      # X connection at import time and the hotkey listener imports it
      # there. ``-a`` picks a free display number rather than assuming
      # :0 is free, which matters when two jobs share a runner.
      - name: Run the suite under a virtual X server
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen python -m pytest tests/ -q -n auto -m "not timing"

      - name: Run the timing tests under a virtual X server
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen python -m pytest tests/ -q -m timing
