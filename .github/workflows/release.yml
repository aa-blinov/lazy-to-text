name: Release

# One product is published from one tag: the Electron interface's installers
# for Windows, macOS and Linux. ``desktop`` builds them (the same workflow
# that builds them on every pull request); ``release`` creates the GitHub
# Release for a ``v*`` tag, with the matching section of CHANGELOG.md as its
# body, and attaches them.
# - Tag push (``v*``) -> build, then create the Release with the installers.
# - Manual dispatch   -> build only; the installers stay as workflow
#                        artifacts for testing.
#
# There is exactly one job that creates the release, so there is no race to
# win and nothing to retry.
#
# Only that job holds a write token. Everything that installs dependencies
# or runs a build has ``contents: read``.
#
# The macOS installers built here are signed ad hoc, because CI has no
# signing identity. An ad-hoc signature's designated requirement is the
# bundle's own hash, so macOS sees every release as a new app and asks for
# the Microphone and Accessibility permissions again after each update. A
# build signed with a stable identity keeps them (see CLAUDE.md, "Signing");
# that needs a certificate in the repository's secrets, which is a release
# decision and not set up here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The installers, built by the same workflow that builds them on every
  # pull request.
  desktop:
    uses: ./.github/workflows/desktop.yml

  release:
    name: Publish the GitHub Release
    needs: desktop
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the release and attaches the installers
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # tests/test_version.py holds the version places to each other in the
      # suite; the tag is the one thing the suite cannot see.
      - name: The tag is the project version
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          python_version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ] || [ "${python_version}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME}, desktop/package.json ${version} and pyproject.toml ${python_version} must agree" >&2
            exit 1
          fi

      # The release body is the changelog section for this version, so the
      # release page says what the changelog says. A tag without a section
      # fails here, before anything is published.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            /^## / { if (found) exit; found = ($2 == v) ; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section '## ${version}'" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Download the installers
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          fail_on_unmatched_files: true
          files: desktop-dist/*
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
