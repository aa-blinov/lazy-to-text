[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-to-text"
version = "0.2.18"
description = "Local ONNX speech-to-text engine and runtime behind the Lazy to Text desktop app (Electron)"
readme = "README.md"
authors = [
    {name = "Alexander Blinov", email = "iam@blinovcorp.ru"}
]
requires-python = ">=3.12"
urls = { Homepage = "https://github.com/aa-blinov/lazy-to-text" }
dependencies = [
    "numpy>=2.4.4",
    "sounddevice>=0.5.5",
    # Windows-only global-hotkeys library (RegisterHotKey).  On
    # macOS / Linux the listener uses ``pynput`` instead.
    "global-hotkeys>=0.1.7; platform_system=='Windows'",
    "pyperclip>=1.11.0",
    "pywin32>=311; platform_system=='Windows'",
    # Cross-platform now: used for auto-paste hotkey simulation on
    # macOS (Cmd+V) and Linux (Ctrl+V).  Windows path keeps its
    # native ``win32api.keybd_event`` route via ``pywin32``.
    "pyautogui>=0.9.54",
    # ``requests`` used to be declared here and imported by nothing —
    # HF Hub talks over ``httpx``, and the only hits in the tree were
    # prose (a docstring and a log-filter tuple). It shipped into the
    # bundle for nothing and invited future contributors to assume the
    # library was available.
    "pyyaml>=6.0.3",
    # libsndfile bindings — fast in-process decoder for the
    # WAV / FLAC / OGG / OPUS / AIFF family used by the file-
    # transcribe view (and as a fast path before falling back to
    # ffmpeg).
    "soundfile>=0.12",
    # Static ffmpeg binary (~70 MB on Windows) bundled as a Python
    # wheel.  Used as the fallback decoder for everything libsndfile
    # can't handle: MP3 / M4A / AAC / WMA / WebM / MOV / MKV / AVI /
    # FLV / 3GP, etc.  Means the file-transcribe view accepts any
    # common audio or video container without making the user
    # install ffmpeg system-wide.
    "imageio-ffmpeg>=0.5",
    "psutil>=6.0",
    # The single ASR backend.  ``onnx-asr`` covers Whisper, GigaAM v3
    # and Parakeet TDT v3 via ONNX Runtime — no PyTorch, no NeMo, no
    # CTranslate2.  ``[cpu,hub]`` everywhere: the stock ``onnxruntime``
    # wheel, which gives CoreML on Apple silicon and CPU elsewhere.
    #
    # 0.12.0 is the floor, not a preference: it is the release that
    # added GigaAM Multilingual (ru / kk / ky / uz).  It also brings
    # onnxruntime's external-data path validation, which is what
    # ``app.utils.materialize_flat_model`` exists to work around — see
    # the comment there before assuming the ``path=`` plumbing is
    # redundant.
    "onnx-asr[cpu,hub]>=0.12.0",
    # Cross-platform XDG / ~/Library / %LOCALAPPDATA% resolver —
    # replaces the hand-rolled ``_user_local_data_dir`` helper.
    "platformdirs>=4.0",
    # Cross-platform single-instance lock (replaces win32event
    # named-mutex on non-Windows).
    "filelock>=3.13",
    # Cross-platform global hotkey listener for non-Windows
    # platforms.  Windows keeps ``global-hotkeys`` for backward
    # compatibility with the existing native binding.
    "pynput>=1.7; platform_system!='Windows'",
    # Cross-platform sound playback for non-Windows platforms
    # (Windows keeps ``winsound`` from stdlib).  Uses AppKit on
    # macOS, GStreamer / aplay on Linux.
    "playsound3>=3.2; platform_system!='Windows'",
    # The Microphone permission probe (``app/mic_check.py``). It used to sit
    # in an optional extra that no sync asked for, so the macOS runtime
    # shipped without it: the status read ``None``, the Settings banner never
    # showed and the system prompt was never requested.
    "pyobjc-framework-avfoundation>=12.1; sys_platform=='darwin'",
]

[project.scripts]
lazy-to-text-server = "app.server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["assets/**/*"]

[dependency-groups]
dev = [
    # The runtime bundler.  Resolves on Windows only so a Mac
    # contributor's ``uv sync`` does not pull it in; CI and
    # ``scripts/build_server.py`` bring it with ``--with``.
    "pyinstaller>=6.0; platform_system=='Windows'",
    # cmake builds the patched PortAudio the macOS bundle ships — the
    # wheel's own dylib deadlocks when a stream is stopped
    # (PortAudio/portaudio#1174).  It is a Python wheel, so it needs no
    # system install, and the PortAudio sources predate cmake 4, which
    # the build accommodates with CMAKE_POLICY_VERSION_MINIMUM.
    "cmake>=3.22; platform_system=='Darwin'",
    "pytest>=9.0.3",
    "pytest-xdist>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "timing: wall-clock budget. Run serially, not under xdist, because parallel load makes the budget flaky.",
]
